<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>खानेपानी तथा सहकारी व्यवस्थापन प्रणाली</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Mukta', sans-serif; background-color: #f1f5f9; }</style>
</head>
<body class="text-slate-800 antialiased">
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div class="flex min-h-screen">
        <aside class="w-72 bg-slate-900 text-slate-200 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-slate-800 bg-slate-950 flex items-center gap-3">
                <img id="sidebar-logo-img" src="https://placehold.co/48x48/2563eb/ffffff?text=खा" class="w-11 h-11 rounded-xl bg-white">
                <div>
                    <h1 id="sidebar-org-name" class="font-bold text-white text-base">पुरानागाउँ खानेपानी</h1>
                    <p class="text-xs text-emerald-400">● सक्रिय प्रणाली</p>
                </div>
            </div>
            <nav class="flex-1 p-3 space-y-1 text-sm">
                <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium bg-blue-600 text-white" data-tab="dashboard">
                    <i class="fas fa-chart-pie w-5"></i> ड्यासबोर्ड
                </button>
                <button onclick="switchTab('reading')" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800" data-tab="reading">
                    <i class="fas fa-tachometer-alt w-5 text-cyan-400"></i> मिटर रिडिङ
                </button>
                <button onclick="switchTab('receipt')" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800" data-tab="receipt">
                    <i class="fas fa-receipt w-5 text-emerald-400"></i> भुक्तानी रसिद
                </button>
                <button onclick="switchTab('members')" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800" data-tab="members">
                    <i class="fas fa-users w-5 text-indigo-400"></i> सदस्य डाटाबेस
                </button>
                <button onclick="switchTab('settings')" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-slate-300 hover:bg-slate-800" data-tab="settings">
                    <i class="fas fa-cogs w-5 text-slate-300"></i> मास्टर सेटिङ
                </button>
            </nav>
        </aside>

        <main class="flex-1 p-6 overflow-x-hidden">
            <!-- Dashboard Tab -->
            <section id="tab-dashboard" class="tab-section space-y-6">
                <div class="bg-white p-5 rounded-2xl shadow-sm border flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800" id="dash-org-title">मुख्य ड्यासबोर्ड</h2>
                        <p class="text-sm text-slate-500">खानेपानी तथा सहकारी व्यवस्थापन प्रणाली</p>
                    </div>
                    <button onclick="switchTab('settings')" class="px-4 py-2 bg-slate-800 text-white rounded-xl text-sm font-semibold">सेटिङ्स</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-l-4 border-l-blue-600">
                        <div class="text-xs font-semibold text-slate-500">कुल सदस्य</div>
                        <div class="text-2xl font-extrabold text-slate-800 mt-1" id="kpi-members">०</div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-l-4 border-l-amber-500">
                        <div class="text-xs font-semibold text-slate-500">उठ्न बाँकी बक्यौता</div>
                        <div class="text-2xl font-extrabold text-amber-600 mt-1" id="kpi-dues">रु. ०</div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-l-4 border-l-emerald-600">
                        <div class="text-xs font-semibold text-slate-500">कुल संकलन</div>
                        <div class="text-2xl font-extrabold text-emerald-600 mt-1" id="kpi-income">रु. ०</div>
                    </div>
                </div>
            </section>

            <!-- Reading Tab -->
            <section id="tab-reading" class="tab-section hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border">
                    <h2 class="text-xl font-bold mb-4">मासिक मिटर रिडिङ इन्ट्री</h2>
                    <form id="reading-form" onsubmit="saveMeterReading(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-1">मसान्त मिति</label>
                            <input type="text" id="read-date" value="२०८३-०७-३०" required class="w-full p-2.5 border rounded-xl bg-slate-50 font-bold">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">सदस्य छान्नुहोस्</label>
                            <select id="read-member" required class="w-full p-2.5 border rounded-xl"><option value="">-- छान्नुहोस् --</option></select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">हालको मिटर अङ्क</label>
                            <input type="number" step="0.01" id="read-curr" required class="w-full p-2.5 border-2 border-blue-400 rounded-xl font-bold">
                        </div>
                        <div class="md:col-span-3 flex justify-end">
                            <button type="submit" class="px-6 py-2.5 bg-blue-600 text-white font-bold rounded-xl shadow">रिडिङ सेभ गर्नुहोस्</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Receipt Tab -->
            <section id="tab-receipt" class="tab-section hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border">
                    <h2 class="text-xl font-bold mb-4">भुक्तानी रसिद इन्ट्री</h2>
                    <form id="payment-form" onsubmit="savePaymentReceipt(event)" class="space-y-4 max-w-lg">
                        <div>
                            <label class="block text-sm font-semibold mb-1">सदस्य छान्नुहोस्</label>
                            <select id="pay-member" required class="w-full p-2.5 border rounded-xl"><option value="">-- छान्नुहोस् --</option></select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">बुझाउने रकम (रु)</label>
                            <input type="number" step="0.01" id="pay-amount" required class="w-full p-2.5 border-2 border-emerald-500 rounded-xl font-bold">
                        </div>
                        <button type="submit" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow">रसिद सेभ गर्नुहोस्</button>
                    </form>
                </div>
            </section>

            <!-- Members Tab -->
            <section id="tab-members" class="tab-section hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border">
                    <h2 class="text-xl font-bold mb-4">सदस्य सूची</h2>
                    <table class="w-full text-sm text-left">
                        <thead><tr class="bg-slate-100 border-b"><th class="p-3">मिटर नं.</th><th class="p-3">नाम</th><th class="p-3">मोबाइल</th><th class="p-3">ठेगाना</th></tr></thead>
                        <tbody id="members-table-body" class="divide-y"></tbody>
                    </table>
                </div>
            </section>

            <!-- Settings Tab -->
            <section id="tab-settings" class="tab-section hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4 max-w-xl">
                    <h2 class="text-xl font-bold border-b pb-2">मास्टर सेटिङ्स</h2>
                    <form onsubmit="saveOrgSettings(event)" class="space-y-3">
                        <div>
                            <label class="text-sm font-semibold">संस्थाको नाम</label>
                            <input type="text" id="set-org-name" required class="w-full p-2.5 border rounded-xl">
                        </div>
                        <div>
                            <label class="text-sm font-semibold">ठेगाना</label>
                            <input type="text" id="set-org-address" required class="w-full p-2.5 border rounded-xl">
                        </div>
                        <button type="submit" class="px-5 py-2 bg-blue-600 text-white font-bold rounded-xl">अपडेट गर्नुहोस्</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('khanepani_erp_db')) || {
            org: { name: "पुरानागाउँ खानेपानी तथा सहकारी", address: "नमोबुद्धा १०, काभ्रे" },
            members: [
                { id: "1", meterNo: "101", name: "राम बहादुर श्रेष्ठ", phone: "9841000000", address: "पुरानागाउँ", openingDue: 500 },
                { id: "2", meterNo: "102", name: "सीता देवी तिमल्सिना", phone: "9851000000", address: "पुरानागाउँ", openingDue: 0 }
            ],
            readings: [], payments: []
        };

        function saveDB() { localStorage.setItem('khanepani_erp_db', JSON.stringify(db)); }
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                if(btn.dataset.tab === tabId) btn.classList.add('bg-blue-600', 'text-white');
            });
            if(tabId === 'dashboard') renderDashboard();
            if(tabId === 'reading') initReadingTab();
            if(tabId === 'receipt') initReceiptTab();
            if(tabId === 'members') renderMembersTable();
            if(tabId === 'settings') initSettingsTab();
        }

        function renderDashboard() {
            document.getElementById('kpi-members').innerText = db.members.length;
            document.getElementById('dash-org-title').innerText = db.org.name;
            document.getElementById('sidebar-org-name').innerText = db.org.name;
        }

        function initReadingTab() {
            const select = document.getElementById('read-member');
            select.innerHTML = '<option value="">-- छान्नुहोस् --</option>';
            db.members.forEach(m => select.innerHTML += `<option value="${m.id}">${m.name} (${m.meterNo})</option>`);
        }

        function saveMeterReading(e) {
            e.preventDefault();
            alert('रिडिङ सफलतापूर्वक सेभ भयो!');
            document.getElementById('reading-form').reset();
        }

        function initReceiptTab() {
            const select = document.getElementById('pay-member');
            select.innerHTML = '<option value="">-- छान्नुहोस् --</option>';
            db.members.forEach(m => select.innerHTML += `<option value="${m.id}">${m.name} (${m.meterNo})</option>`);
        }

        function savePaymentReceipt(e) {
            e.preventDefault();
            alert('भुक्तानी सुरक्षित भयो!');
            document.getElementById('payment-form').reset();
        }

        function renderMembersTable() {
            const tbody = document.getElementById('members-table-body');
            tbody.innerHTML = '';
            db.members.forEach(m => {
                tbody.innerHTML += `<tr class="border-b"><td class="p-3 font-bold">${m.meterNo}</td><td class="p-3">${m.name}</td><td class="p-3">${m.phone || '-'}</td><td class="p-3">${m.address}</td></tr>`;
            });
        }

        function initSettingsTab() {
            document.getElementById('set-org-name').value = db.org.name;
            document.getElementById('set-org-address').value = db.org.address;
        }

        function saveOrgSettings(e) {
            e.preventDefault();
            db.org.name = document.getElementById('set-org-name').value;
            db.org.address = document.getElementById('set-org-address').value;
            saveDB();
            alert('अपडेट भयो!');
            renderDashboard();
        }

        window.onload = function() { renderDashboard(); };
    </script>
</body>
</html>
